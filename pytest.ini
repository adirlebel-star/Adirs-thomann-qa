[pytest]
pythonpath = .
testpaths = tests
addopts = --base-url https://www.thomannmusic.com --screenshot only-on-failure --video retain-on-failure --html=report.html --self-contained-html
markers =
    smoke: quick sanity checks
    search: search functionality
    product: product page checks
    cart: basket checks
    nav: navigation checks
    seo: SEO / responsive checks
