name: Run tests

on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # The site rate-limits, so run the groups one at a time with a pause between them.
      - name: Run test groups
        run: |
          status=0
          for m in smoke search nav product cart seo; do
            pytest -m $m -rs --html=reports/$m.html || status=1
            sleep 60
          done
          exit $status

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            test-results/
